<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和田地区水产养殖流向图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        /* ========== Loading Screen ========== */
        .loading-screen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #e8f5f4 0%, #e3f2fd 45%, #fff8e1 100%);
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out;
        }
        .loading-screen.hide { opacity: 0; pointer-events: none; }

        .load-ring {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00695c, #26a69a);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 105, 92, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        .load-ring span { font-size: 52px; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 40px rgba(0,105,92,0.3); }
            50%      { transform: scale(0.9); box-shadow: 0 6px 20px rgba(0,105,92,0.2); }
        }
        .loading-text {
            margin-top: 28px; font-size: 20px; font-weight: 600;
            color: #00695c; letter-spacing: 3px;
        }
        .loading-sub {
            margin-top: 10px; font-size: 12px;
            color: #80a0a0; letter-spacing: 2px;
        }

        /* ========== Main Container ========== */
        .container {
            width: 100%; height: 100vh; position: relative;
            background: linear-gradient(180deg, #f5fafb 0%, #e8f0f3 100%);
        }
        .container::before {
            content: ''; position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 70%;
            background: radial-gradient(ellipse, rgba(38,166,154,0.05) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* ========== Header ========== */
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            z-index: 100; padding: 20px 32px;
            background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.5) 70%, transparent 100%);
            display: flex; align-items: center; gap: 14px;
        }
        .header-bar {
            width: 5px; height: 38px; border-radius: 3px;
            background: linear-gradient(180deg, #00695c, #26a69a);
        }
        .header-info { display: flex; flex-direction: column; gap: 3px; }
        .header-title {
            font-size: 22px; font-weight: 700;
            color: #004d40; letter-spacing: 1.5px;
        }
        .header-sub {
            font-size: 11px; color: #80a0a0;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* ========== Map ========== */
        #map {
            width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.6s ease-in;
            position: relative; z-index: 1;
        }
        #map.show { opacity: 1; }

        /* ========== Legend Card ========== */
        .legend-card {
            position: absolute; left: 24px; top: 92px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 105, 92, 0.15);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
        }
        .legend-title {
            font-size: 13px; font-weight: 600;
            color: #004d40; margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 10px;
            padding: 5px 0; font-size: 13px; color: #37474f;
        }
        .legend-line {
            width: 30px; height: 3px; border-radius: 2px;
        }
        .legend-line.tech    { background: #0288d1; box-shadow: 0 0 8px rgba(2,136,209,0.5); }
        .legend-line.material { background: #f57c00; box-shadow: 0 0 8px rgba(245,124,0,0.5); }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .legend-dot.origin { background: #00695c; box-shadow: 0 0 8px rgba(0,105,92,0.5); }
        .legend-dot.tech-node { background: #0288d1; box-shadow: 0 0 8px rgba(2,136,209,0.4); }
        .legend-dot.mat-node { background: #f57c00; box-shadow: 0 0 8px rgba(245,124,0,0.4); }

        /* ========== Stats Panel ========== */
        .stats-panel {
            position: absolute; right: 24px; bottom: 24px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 105, 92, 0.15);
            border-radius: 14px;
            padding: 18px 24px; min-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .stats-title {
            font-size: 13px; font-weight: 600;
            color: #004d40; margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .stats-row {
            display: flex; justify-content: space-between;
            align-items: center; padding: 7px 0; font-size: 13px;
        }
        .stats-label { color: #78909c; display: flex; align-items: center; gap: 8px; }
        .stats-value { font-weight: 700; color: #004d40; }
        .stats-divider { border-top: 1px solid rgba(0,0,0,0.06); margin: 6px 0; }

        /* ========== Corner Tag ========== */
        .corner-deco {
            position: absolute; bottom: 24px; left: 24px;
            z-index: 100; font-size: 11px; color: #90a4ae;
            letter-spacing: 1px;
        }

        /* ========== Responsive (Embed) ========== */
        @media (max-width: 768px) {
            .header { padding: 14px 20px; }
            .header-title { font-size: 18px; }
            .header-sub { display: none; }
            .legend-card { left: 12px; top: 68px; padding: 12px 14px; }
            .legend-item { font-size: 12px; }
            .stats-panel { right: 12px; bottom: 12px; padding: 14px 18px; min-width: 180px; }
            .corner-deco { display: none; }
        }
        @media (max-width: 480px) {
            .header { padding: 10px 16px; }
            .header-title { font-size: 15px; }
            .legend-card { left: 8px; top: 56px; padding: 10px 12px; }
            .legend-item { font-size: 11px; gap: 8px; }
            .legend-line { width: 22px; }
            .stats-panel { right: 8px; bottom: 8px; min-width: 150px; padding: 12px 14px; }
            .stats-row { font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loader">
        <div class="load-ring"><span>🐟</span></div>
        <p class="loading-text">和田水产养殖流向图</p>
        <p class="loading-sub">LOADING MAP DATA...</p>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-bar"></div>
            <div class="header-info">
                <div class="header-title">和田地区水产养殖流向图</div>
                <div class="header-sub">Hotan Aquaculture Flow Map</div>
            </div>
        </div>

        <!-- Map -->
        <div id="map"></div>

        <!-- Legend Card -->
        <div class="legend-card">
            <div class="legend-title">图例说明</div>
            <div class="legend-item">
                <div class="legend-line tech"></div>
                <span>技术流入</span>
            </div>
            <div class="legend-item">
                <div class="legend-line material"></div>
                <span>原料物资流出</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot origin"></div>
                <span>起源地（和田）</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot tech-node"></div>
                <span>技术流入节点</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot mat-node"></div>
                <span>原料流出节点</span>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stats-title">📊 流向统计</div>
            <div class="stats-row">
                <span class="stats-label">
                    <span class="legend-dot" style="width:8px;height:8px;background:#0288d1"></span>
                    技术流入
                </span>
                <span class="stats-value">4 条</span>
            </div>
            <div class="stats-row">
                <span class="stats-label">
                    <span class="legend-dot" style="width:8px;height:8px;background:#f57c00"></span>
                    原料流出
                </span>
                <span class="stats-value">2 条</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-row">
                <span class="stats-label">合计流向</span>
                <span class="stats-value">6 条</span>
            </div>
        </div>

        <!-- Corner -->
        <div class="corner-deco">© 水产养殖数据可视化</div>
    </div>

    <script>
        // OD数据
        const rawData = [
            {Type:"技术",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"宁波大学",To_X:121.636479,To_Y:29.908539},
            {Type:"技术",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"中国水产科学研究院南海水产研究所",To_X:113.311445,To_Y:23.095904},
            {Type:"技术",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"天津市水产研究所",To_X:117.231525,To_Y:39.070228},
            {Type:"技术",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"江苏河蟹养殖产业基地",To_X:118.78,To_Y:32.04},
            {Type:"原料",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"海南三亚崖州区",To_X:109.167372,To_Y:18.359129},
            {Type:"原料",From_City:"和田地区",From_X:79.920537,From_Y:37.11388,To_City:"四川眉山专业水产繁育基地",To_X:103.848417,To_Y:30.077113}
        ];

        const techList     = rawData.filter(item => item.Type === "技术");
        const materialList = rawData.filter(item => item.Type === "原料");

        const chartDom = document.getElementById('map');
        const myChart  = echarts.init(chartDom);

        // 长名称缩写
        function shortName(name) {
            const map = {
                "中国水产科学研究院南海水产研究所": "南海水产研究所",
                "四川眉山专业水产繁育基地": "眉山水产繁育基地",
                "江苏河蟹养殖产业基地": "江苏河蟹养殖基地",
                "天津市水产研究所": "天津水产研究所"
            };
            return map[name] || name;
        }

        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                show: true,
                trigger: 'item',
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: 'rgba(0,105,92,0.2)',
                borderWidth: 1,
                textStyle: { color: '#004d40', fontSize: 13 },
                extraCssText: 'box-shadow: 0 4px 16px rgba(0,0,0,0.1); border-radius: 8px;'
            },
            geo: {
                map: 'china',
                roam: true,
                zoom: 0.95,
                center: [100, 35],
                aspectScale: 0.75,
                label: { show: false },
                itemStyle: {
                    areaColor: '#ffffff',
                    borderColor: 'rgba(38, 166, 154, 0.45)',
                    borderWidth: 1.0,
                    shadowColor: 'rgba(0, 105, 92, 0.08)',
                    shadowBlur: 10
                },
                emphasis: {
                    itemStyle: {
                        areaColor: '#e0f2f1',
                        borderColor: 'rgba(38, 166, 154, 0.8)'
                    },
                    label: { show: false }
                }
            },
            series: [
                // ===== 技术流入 - 主线 =====
                {
                    name: "技术流入",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 1,
                    lineStyle: {
                        width: 2.2, curveness: 0.3,
                        color: "#0288d1", opacity: 0.65,
                        shadowBlur: 10, shadowColor: "rgba(2,136,209,0.4)"
                    },
                    data: techList.map(item => ({
                        coords: [[item.To_X, item.To_Y], [item.From_X, item.From_Y]]
                    }))
                },
                // ===== 技术流入 - 粒子动画 =====
                {
                    name: "技术流入",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 3,
                    effect: {
                        show: true, trailLength: 0.04,
                        period: 4.5, symbolSize: 5, color: "#4fc3f7"
                    },
                    lineStyle: { width: 0, curveness: 0.3 },
                    data: techList.map(item => ({
                        coords: [[item.To_X, item.To_Y], [item.From_X, item.From_Y]]
                    }))
                },
                // ===== 原料流出 - 主线 =====
                {
                    name: "原料物资流出",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 1,
                    lineStyle: {
                        width: 2.2, curveness: 0.3,
                        color: "#f57c00", opacity: 0.65,
                        shadowBlur: 10, shadowColor: "rgba(245,124,0,0.4)"
                    },
                    data: materialList.map(item => ({
                        coords: [[item.From_X, item.From_Y], [item.To_X, item.To_Y]]
                    }))
                },
                // ===== 原料流出 - 粒子动画 =====
                {
                    name: "原料物资流出",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 3,
                    effect: {
                        show: true, trailLength: 0.04,
                        period: 5.2, symbolSize: 5, color: "#ffb74d"
                    },
                    lineStyle: { width: 0, curveness: 0.3 },
                    data: materialList.map(item => ({
                        coords: [[item.From_X, item.From_Y], [item.To_X, item.To_Y]]
                    }))
                },
                // ===== 起源地节点 - 和田地区 =====
                {
                    name: "和田地区",
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    zlevel: 4,
                    symbolSize: 16,
                    rippleEffect: { brushType: 'stroke', period: 3, scale: 4 },
                    label: {
                        show: true, position: 'top',
                        color: '#004d40', fontSize: 13, fontWeight: 700,
                        formatter: '{b}',
                        textShadowColor: '#ffffff', textShadowBlur: 4
                    },
                    itemStyle: {
                        color: '#00695c',
                        shadowBlur: 12, shadowColor: 'rgba(0,105,92,0.5)'
                    },
                    data: [{ name: '和田地区', value: [79.920537, 37.11388] }]
                },
                // ===== 技术流入目的地节点 =====
                {
                    name: "技术流入节点",
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    zlevel: 4,
                    symbolSize: 10,
                    rippleEffect: { brushType: 'stroke', period: 2.5, scale: 3.5 },
                    label: {
                        show: true, position: 'top',
                        color: '#0277bd', fontSize: 11, fontWeight: 500,
                        formatter: function(p) { return p.name; },
                        textShadowColor: '#ffffff', textShadowBlur: 3
                    },
                    itemStyle: {
                        color: '#0288d1',
                        shadowBlur: 8, shadowColor: 'rgba(2,136,209,0.4)'
                    },
                    data: techList.map(item => ({
                        name: shortName(item.To_City),
                        value: [item.To_X, item.To_Y]
                    }))
                },
                // ===== 原料流出目的地节点 =====
                {
                    name: "原料流出节点",
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    zlevel: 4,
                    symbolSize: 10,
                    rippleEffect: { brushType: 'stroke', period: 2.5, scale: 3.5 },
                    label: {
                        show: true, position: 'top',
                        color: '#e65100', fontSize: 11, fontWeight: 500,
                        formatter: function(p) { return p.name; },
                        textShadowColor: '#ffffff', textShadowBlur: 3
                    },
                    itemStyle: {
                        color: '#f57c00',
                        shadowBlur: 8, shadowColor: 'rgba(245,124,0,0.4)'
                    },
                    data: materialList.map(item => ({
                        name: shortName(item.To_City),
                        value: [item.To_X, item.To_Y]
                    }))
                }
            ]
        };

        // Loading -> Render
        const loader = document.getElementById('loader');
        const mapDom = document.getElementById('map');
        setTimeout(() => {
            loader.classList.add('hide');
            setTimeout(() => {
                myChart.setOption(option);
                mapDom.classList.add('show');
            }, 600);
        }, 2200);

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
