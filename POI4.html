<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>点位叠加展示</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  padding: 20px;
  background: #fff;
}
/* 横版容器 */
.map-box {
  width: 900px;
  height: 550px;
  position: relative;
  border: 1px solid #ccc;
  background: #ffffff;
}
.map-base, .point-item {
  width: 100%;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
  object-fit: contain;
  object-position: center;
}
.map-base {
  z-index: 1;
}
.point-item {
  mix-blend-mode: multiply;
  transition: opacity 0.25s ease;
}
/* 由底层到顶层 */
#public  { z-index: 2; }
#hotel   { z-index: 3; }
#food    { z-index: 4; }

.hidden {
  opacity: 0;
  pointer-events: none;
}
.btn-group {
  margin-top: 16px;
  display: flex;
  gap: 12px;
}
.btn-group button {
  padding: 9px 22px;
  font-size: 15px;
  background-color: #ffd440;
  border: none;
  cursor: pointer;
  border-radius: 2px;
}
.btn-group button.active {
  background-color: #ffb900;
}
</style>
</head>
<body>

<div class="map-box">
  <img class="map-base" src="base.png">
  <img class="point-item" id="public" src="public.svg">
  <img class="point-item" id="hotel" src="hotel.svg">
  <img class="point-item" id="food" src="food.svg">
</div>

<div class="btn-group">
  <button class="switch-btn active" data-target="food">餐饮</button>
  <button class="switch-btn active" data-target="hotel">住宿</button>
  <button class="switch-btn active" data-target="public">公共设施</button>
</div>

<script>
const btns = document.querySelectorAll('.switch-btn');
btns.forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    const targetId = btn.getAttribute('data-target');
    document.getElementById(targetId).classList.toggle('hidden');
  })
})
</script>

</body>
</html>
